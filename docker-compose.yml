services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: flowparser_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:admin@db:5432/flowparser_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      # front w kontenerze będzie gadał z backendem po nazwie serwisu "api"
      - NEXT_PUBLIC_API_BASE_URL=http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app          # kod źródłowy Next
      - /app/node_modules        # node_modules trzymamy w kontenerze
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  pgdata:
